# Pettan! MOCHI HOCKEY の CI/CD
# - PR / main への push：EditMode・PlayMode テスト
# - main への push（テスト成功時のみ）：WebGL ビルド → GitHub Pages へデプロイ
#
# 必要な Secrets（Settings → Secrets and variables → Actions）:
#   UNITY_LICENSE  … Unity Personal の .ulf ファイルの中身
#   UNITY_EMAIL    … Unity アカウントのメールアドレス
#   UNITY_PASSWORD … Unity アカウントのパスワード
# Pages の Source は「GitHub Actions」にしておくこと。

name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# 同じ PR で新しい実行が始まったら、古い実行を止める（main のデプロイは途中で止めない）
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
  UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
  UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}

jobs:
  test:
    name: Test (${{ matrix.testMode }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write # テスト結果を PR のチェックとして表示する
    strategy:
      fail-fast: false
      matrix:
        testMode: [editmode, playmode]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # LFS の実体は .git/lfs をキャッシュし、変わった分だけ取得する
      - name: Create LFS file list
        run: git lfs ls-files -l | cut -d' ' -f1 | sort > .lfs-assets-id

      - name: Restore LFS cache
        uses: actions/cache@v4
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.lfs-assets-id') }}

      - name: Git LFS pull
        run: |
          git lfs pull
          git add .
          git reset --hard

      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-test-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-test-

      - name: Run tests
        uses: game-ci/unity-test-runner@v4
        id: tests
        with:
          testMode: ${{ matrix.testMode }}
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: ${{ matrix.testMode }} test results
          artifactsPath: artifacts/${{ matrix.testMode }}
          # 既定の latest だと実行のたびに GitHub API で最新版を調べ、403（回数制限）で失敗することがある
          cliVersion: v0.1.76

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.testMode }}
          path: artifacts/${{ matrix.testMode }}
          if-no-files-found: warn

  build:
    name: Build WebGL
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create LFS file list
        run: git lfs ls-files -l | cut -d' ' -f1 | sort > .lfs-assets-id

      - name: Restore LFS cache
        uses: actions/cache@v4
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.lfs-assets-id') }}

      - name: Git LFS pull
        run: |
          git lfs pull
          git add .
          git reset --hard

      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-WebGL-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-WebGL-

      - name: Build
        uses: game-ci/unity-builder@v4
        with:
          targetPlatform: WebGL
          buildsPath: build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/WebGL/WebGL

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
